{% extends "base.html" %}

{% block title %}Ustawienia - SleepWatch{% endblock %}

{% block content %}
<style>
    .settings-page {
        display: grid;
        gap: 24px;
    }

    .settings-hero,
    .settings-card {
        border-radius: 28px;
        border: 1px solid var(--border);
        background:
            radial-gradient(circle at top right, rgba(83, 160, 194, 0.1), transparent 28%),
            linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(241, 248, 252, 0.92));
    }

    .settings-hero {
        padding: 28px;
    }

    .settings-hero h1,
    .settings-card h3 {
        margin-top: 0;
    }

    .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .settings-card {
        padding: 24px;
        display: grid;
        gap: 12px;
        align-content: start;
    }

    .settings-card-label {
        width: fit-content;
        border-radius: 999px;
        padding: 7px 11px;
        background: rgba(22, 78, 125, 0.12);
        color: var(--accent-dark);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .settings-card p {
        margin: 0;
    }

    .settings-card .button {
        width: fit-content;
        margin-top: 6px;
    }

    :root[data-theme="dark"] .settings-hero,
    :root[data-theme="dark"] .settings-card {
        border-color: rgba(124, 164, 200, 0.16);
        background:
            radial-gradient(circle at top right, rgba(183, 168, 243, 0.1), transparent 28%),
            linear-gradient(180deg, rgba(29, 24, 50, 0.98), rgba(22, 19, 39, 0.96));
    }

    :root[data-theme="dark"] .settings-card-label {
        background: rgba(183, 168, 243, 0.14);
        color: #dcecff;
    }

    @media (max-width: 820px) {
        .settings-grid {
            grid-template-columns: 1fr;
        }
    }
    .settings-hero,
    .settings-card {
        border-radius: 8px;
        border-color: rgba(15, 76, 70, 0.12);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 252, 250, 0.96));
        box-shadow: 0 12px 26px rgba(42, 31, 83, 0.07);
    }

    .settings-hero {
        position: relative;
        overflow: hidden;
    }

    .settings-hero::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, #39236e, #c4b5fd, #d97757);
    }

    .settings-card-label {
        background: rgba(57, 35, 110, 0.1);
        color: #4c1d95;
    }

    :root[data-theme="dark"] .settings-hero,
    :root[data-theme="dark"] .settings-card {
        border-color: rgba(183, 168, 243, 0.16);
        background: linear-gradient(180deg, rgba(29, 24, 50, 0.98), rgba(22, 19, 39, 0.96));
    }

    :root[data-theme="dark"] .settings-card-label {
        background: rgba(183, 168, 243, 0.14);
        color: #ddd4ff;
    }

    .settings-card-label,
    .settings-card .button {
        font-weight: 600;
    }
</style>

<div class="settings-page">
    <section class="settings-hero">
        <div class="section-label">Ustawienia</div>
        <h1>Centrum ustawień</h1>
    </section>

    <section class="settings-grid" aria-label="Sekcje ustawień">
        {% for section in settings_sections %}
            <article class="settings-card">
                <span class="settings-card-label">{{ section.label }}</span>
                <h3>{{ section.title }}</h3>
                <p>{{ section.body }}</p>
                <a class="button secondary" href="{% url section.url_name %}">{{ section.action }}</a>
            </article>
        {% endfor %}
    </section>
</div>
{% endblock %}
